<!doctype html>
<html lang="en" dir="ltr" data-ui="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d13">
<title>Template Studio — Original Photo & Video Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts are optional: if offline, the canvas falls back to system fonts (incl. system Arabic fonts). -->
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Bebas+Neue&family=Cairo:wght@400;600;700;900&family=Montserrat:wght@400;600;800;900&family=Orbitron:wght@500;800&family=Playfair+Display:wght@500;700;900&family=Poppins:wght@300;400;500;600;700;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all';window.__fcss=1;window.__fl&&window.__fl()"><noscript><link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Bebas+Neue&family=Cairo:wght@400;600;700;900&family=Montserrat:wght@400;600;800;900&family=Orbitron:wght@500;800&family=Playfair+Display:wght@500;700;900&family=Poppins:wght@300;400;500;600;700;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet"></noscript>
<style>
:root{--bg:#0b0d13;--panel:#11141d;--card:#1a1e2b;--card2:#222738;--line:#272c3d;--txt:#eceff8;--mut:#8f97ad;--acc:#7c5cff;--acc2:#ff4d8d;--ok:#2ee59d;--bad:#ff5d6c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 Poppins,Cairo,system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
html[data-ui=ar] .en,html[data-ui=en] .ar{display:none!important}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:56px minmax(0,1fr);height:100dvh}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:15px}
.hdr{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:8px;color:var(--mut);font-weight:600;font-size:12.5px}
.seg button.on{background:var(--acc);color:#fff}
.seg.full{display:flex;width:100%}.seg.full button{flex:1;padding:8px 6px}
.trimbar{height:8px;border-radius:6px;background:var(--card2);margin:8px 0 2px;position:relative;overflow:hidden}.trimbar i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px}
details.extbox>summary{cursor:pointer;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);padding:2px 0}details.extbox[open]>summary{margin-bottom:8px}
.seg button.on.pro{background:linear-gradient(135deg,#ffb300,#ff6a00)}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 13px;border-radius:10px;font-weight:600;font-size:13px}
.btn:hover{background:var(--card2)}
.btn.primary{background:linear-gradient(135deg,var(--acc),#a455ff);border-color:transparent;color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.full{width:100%;margin-top:8px}
.stage-wrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;position:relative;background:radial-gradient(1200px 700px at 50% 30%,#1a1f33,#0b0d13 70%)}
canvas#cv{touch-action:none;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#000;display:block;flex:none}
.transport{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
.transport .pbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:15px;flex:none}
.transport input{flex:1}
.transport span{font-variant-numeric:tabular-nums;color:var(--mut);font-size:12.5px;min-width:84px;text-align:end}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-inline-start:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:11px 8px;color:var(--mut);font-weight:600;font-size:12.5px;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:var(--acc)}
.panes{flex:1;overflow:auto;min-height:0}
.pane{display:none;padding:14px 14px 40px}.pane.on{display:block}
h4{margin:18px 0 8px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);font-weight:600}
h4:first-child{margin-top:2px}
.note{color:var(--mut);font-size:12.5px;margin:6px 0}
.tplgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{background:var(--card);border:2px solid transparent;border-radius:12px;padding:8px;text-align:center;color:var(--txt)}
.tpl.on{border-color:var(--acc);background:var(--card2)}
.tpl .th{height:150px;display:grid;place-items:center}
.tpl canvas{max-width:100%;max-height:150px;border-radius:6px}
.tpl b{display:block;margin-top:6px;font-size:12.5px}.tpl small{color:var(--mut)}
.drop{display:block;border:2px dashed #39405a;border-radius:14px;padding:20px 12px;text-align:center;cursor:pointer;background:var(--card)}
.drop:hover,.drop.over{border-color:var(--acc);background:var(--card2)}
.drop .big{font-size:28px}.drop small{display:block;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row>label{min-width:86px;color:var(--mut);font-size:12.5px}.row input[type=range]{flex:1}
.row .v{min-width:44px;text-align:end;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--acc);height:28px}
input[type=color]{width:42px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:2px}
select,textarea,input[type=text]{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
textarea{resize:vertical;min-height:54px}
select{width:auto;flex:1}
.titem{margin-bottom:10px}.titem.sel textarea{border-color:var(--acc);box-shadow:0 0 0 2px rgba(124,92,255,.25)}
.titem label{font-size:11.5px;color:var(--mut)}
.trk{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border:2px solid transparent;border-radius:12px;margin-bottom:8px;cursor:pointer}
.trk.on{border-color:var(--acc);background:var(--card2)}
.trk .ic{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
.trk.on .ic{background:var(--acc)}.trk b{display:block;font-size:13.5px}.trk small{color:var(--mut)}
.trk .tag{margin-inline-start:auto;font-size:10.5px;padding:2px 7px;border-radius:6px;background:#2a3047;color:#aab3d0}
details{background:var(--card);border-radius:12px;padding:10px 12px;margin-top:14px}summary{cursor:pointer;font-weight:600}
pre{direction:ltr;text-align:left;background:#0b0d13;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:11.5px;color:#cfd6ee}
code{direction:ltr;unicode-bidi:embed;background:#0b0d13;padding:1px 5px;border-radius:5px}
.modal{position:fixed;inset:0;background:rgba(5,6,10,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(520px,100%);max-height:90dvh;overflow:auto}
.modal h3{margin:0 0 10px}
.bar{height:10px;background:var(--card2);border-radius:999px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .15s}
.proj{display:flex;gap:10px;align-items:center;padding:8px;background:var(--card);border-radius:10px;margin-bottom:8px}
.proj img{width:44px;height:60px;object-fit:cover;border-radius:6px;background:#000}.proj .nm{flex:1;min-width:0}.proj b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.proj small{color:var(--mut)}
.row input[type=text]{flex:1;min-width:0}
.extbox{background:var(--card);border-radius:12px;padding:12px;margin-bottom:14px}
.extbox h4{margin:0 0 8px}
.extrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}
.extrow:first-child{border-top:0}
.extrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start;color:var(--mut)}
.extrow .x{border:0;background:transparent;color:var(--mut);font-size:16px;padding:0 4px}
.tag.st{display:inline-flex;align-items:center;white-space:nowrap}
.tag.st.loading{background:#3a3320;color:#ffcf6b}.tag.st.ready{background:#143626;color:var(--ok)}.tag.st.failed{background:#3b1a20;color:var(--bad)}
.tag.st.loading::before{content:'';width:8px;height:8px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;display:inline-block;margin-inline-end:5px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.trk .sub{display:block;color:var(--mut);font-size:12px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:#2a3047;border:1px solid var(--line);padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#exVideo{width:100%;max-height:50dvh;border-radius:10px;background:#000;margin-top:8px}

.quick{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.qh{display:flex;gap:4px;align-items:center;flex:none}
.ib{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:17px;line-height:1;display:grid;place-items:center;padding:0}
.ib:disabled{opacity:.35;cursor:default}.ib:not(:disabled):hover{background:var(--card2)}
#saveInd{font-size:11px;color:var(--mut);white-space:nowrap;display:flex;gap:4px;align-items:center;opacity:0;transition:opacity .3s}
#saveInd.show{opacity:1}#saveInd.busy{opacity:.5}
.qs{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.qs::-webkit-scrollbar{display:none}
.qgrp{display:flex;gap:5px;align-items:center;flex:none}
.qsep{width:1px;height:22px;background:var(--line);flex:none}
.qlbl{flex:none;font-size:15px}
.fmt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--mut);white-space:nowrap}
.fmt i{display:block;border:2px solid currentColor;border-radius:3px;flex:none}
.fmt.on{background:var(--acc);border-color:var(--acc);color:#fff}
.mood{width:28px;height:28px;border-radius:50%;border:2px solid transparent;padding:0;flex:none;box-shadow:0 0 0 1px var(--line) inset}
.mood.on{border-color:#fff}
.mood.none{background:repeating-linear-gradient(45deg,#2a3047 0 4px,#1a1e2b 4px 8px)}
.photostrip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--line);background:var(--panel);min-height:46px}
.photostrip .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font-size:12.5px}
.photostrip .btn{white-space:nowrap}
.bgrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.bgsw{flex:none;width:66px;border:2px solid transparent;background:var(--card);border-radius:10px;padding:3px;color:var(--txt)}
.bgsw canvas{display:block;width:100%;height:auto;border-radius:6px}
.bgsw small{display:block;font-size:10.5px;color:var(--mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bgsw.on{border-color:var(--acc);background:var(--card2)}
.bgsw .def{display:grid;place-items:center;aspect-ratio:3/4;font-size:20px;border-radius:6px;background:var(--card2)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.preset{border:1px solid var(--line);background:var(--card);padding:7px 11px;border-radius:10px;font-size:12.5px;text-align:start}
.preset:hover{background:var(--card2);border-color:var(--acc)}
.photostrip .ib{flex:none}
.stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.stkb{aspect-ratio:1;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:26px;line-height:1;padding:0;display:grid;place-items:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.stkb:hover,.stkb:active{background:var(--card2);border-color:var(--acc)}
.stkb.badgeb{grid-column:span 2;aspect-ratio:auto;padding:9px 6px;font:800 12.5px Poppins,Cairo,sans-serif;color:#fff;border:0}
.selbox{background:var(--card);border-radius:12px;padding:10px 12px;margin:14px 0;border:1px solid var(--acc)}
.selbox .row:first-of-type{margin-top:0}
.selbox .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seqlist{display:flex;gap:8px;overflow-x:auto;padding:6px 0 8px;scrollbar-width:thin}
.sq{flex:none;width:62px;position:relative;background:var(--card);border-radius:10px;padding:3px;text-align:center}
.sq canvas{display:block;width:100%;height:auto;border-radius:7px;background:#000}
.sq .n{position:absolute;top:6px;inset-inline-start:7px;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;font-size:10.5px;padding:0 5px;line-height:16px}
.sq .ac{display:flex;justify-content:space-between;margin-top:2px}
.sq .ac button{border:0;background:transparent;color:var(--mut);font-size:13px;padding:4px 3px;line-height:1}
.sq .ac button.x{color:var(--bad)}.sq .ac button:disabled{opacity:.25}
@media(max-width:520px){.lbl{display:none}}
@media(max-width:860px){
 .app{grid-template-columns:minmax(0,1fr);grid-template-rows:52px 50dvh minmax(0,1fr)}
 .side{border-inline-start:0;border-top:1px solid var(--line)}
 .brand span.nm{display:none}
 .stage{padding:8px}
 .transport{padding:6px 12px}.transport .pbtn{width:36px;height:36px}
 .tpl .th{height:120px}.tpl canvas{max-height:120px}
}
</style>
</head>
<body>
<div class="app">
 <header>
  <div class="brand"><div class="logo">✦</div><span class="nm">Template Studio</span></div>
  <div class="hdr">
   <button class="btn sm" id="btnNew" aria-label="New project">✚ <span class="lbl" data-i="newProj"></span></button>
   <button class="btn sm" id="btnProjects">💾 <span class="lbl" data-i="projects"></span></button>
   <div class="seg" id="planSeg"><button data-plan="free" data-i="free"></button><button data-plan="pro" class="pro" data-i="pro"></button></div>
   <div class="seg" id="uiSeg"><button data-ul="en">EN</button><button data-ul="ar">ع</button></div>
  </div>
 </header>

 <section class="stage-wrap">
  <div class="quick" id="quick">
   <div class="qh"><button class="ib" id="btnUndo" disabled>↶</button><button class="ib" id="btnRedo" disabled>↷</button><span id="saveInd"><span>✓</span><span class="lbl" id="saveTxt"></span></span></div>
   <div class="qs"><div class="qgrp" id="fmtChips"></div><i class="qsep"></i><span class="qlbl">🎨</span><div class="qgrp" id="moodChips"></div></div>
  </div>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>
  <div class="photostrip" id="photoStrip">
   <button class="btn sm primary" id="btnAddPhoto"></button>
   <span class="pname" id="psName"></span>
   <button class="btn sm" id="btnChoosePhoto" style="display:none"></button>
   <button class="btn sm danger" id="btnRemoveTop" style="display:none"></button>
   <button class="ib" id="btnQStk" type="button">😊</button><button class="ib" id="btnQOvl" type="button">🖼</button>
  </div>
  <div class="transport">
   <button class="pbtn" id="btnPlay" aria-label="Play">▶</button>
   <input type="range" id="scrub" min="0" max="1000" value="0">
   <span id="timeLbl">0:00 / 0:08</span>
  </div>
 </section>

 <aside class="side">
  <nav class="tabs" id="tabs"></nav>
  <div class="panes">

   <div class="pane on" id="p-templates">
    <h4 data-i="bgTitle"></h4>
    <div class="chips" id="bgCats" style="margin:0 0 8px"></div>
    <div class="bgrow" id="bgRow"></div>
    <h4 data-i="tTemplates"></h4>
    <div class="chips" id="tplCats" style="margin:4px 0 10px"></div>
    <div class="tplgrid" id="tplGrid"></div>
    <details class="extbox" style="margin-top:18px">
     <summary data-i="extTitle"></summary>
     <div class="row"><input type="text" id="extUrl" dir="ltr" autocomplete="off" spellcheck="false"><button class="btn sm primary" id="btnExtLoad" data-i="extLoad"></button></div>
     <div class="row" style="flex-wrap:wrap"><label class="btn sm" for="extFile" style="cursor:pointer;min-width:0;color:var(--txt)" data-i="extFile"></label><input type="file" id="extFile" accept=".json,application/json" hidden>
      <button class="btn sm" id="btnExtReload" data-i="extReload"></button><button class="btn sm danger" id="btnExtClear" data-i="extClear"></button></div>
     <div id="extList"></div>
     <div class="note" data-i="extHint"></div>
    </details>
   </div>

   <div class="pane" id="p-media">
    <label class="drop" id="mediaDrop"><input type="file" id="fileMedia" accept="image/*,video/mp4,video/webm,video/quicktime,video/*" multiple hidden>
     <div class="big">📷 🎞</div><b data-i="upload"></b><small data-i="dropHint"></small></label>
    <div class="note" id="mediaInfo"></div>
    <button class="btn full danger" id="btnRemoveMedia" data-i="remove"></button>
    <div id="seqBox">
     <h4 data-i="seqTitle"></h4>
     <button class="btn full" id="btnAddMore" type="button" data-i="seqAdd" style="margin-top:0"></button>
     <input type="file" id="fileMore" accept="image/*" multiple hidden>
     <div class="seqlist" id="seqList"></div>
     <div id="seqCtl" style="display:none">
      <div class="row"><label data-i="seqPer"></label><input type="range" id="seqPer" min="10" max="80" step="5" value="25"><span class="v" id="seqPerV"></span></div>
      <div class="chips" id="seqTrans" style="margin:4px 0 6px"></div>
      <div class="note" id="seqInfo"></div>
     </div>
     <div class="note" data-i="seqHint"></div>
    </div>
    <div id="trimBox" style="display:none">
     <h4 data-i="trim"></h4>
     <div class="trimbar"><i id="trimSel"></i></div>
     <div class="row"><label data-i="trimStart"></label><input type="range" id="trimA" min="0" max="10" value="0"><span class="v" id="trimAV"></span></div>
     <div class="row"><label data-i="trimEnd"></label><input type="range" id="trimB" min="0" max="10" value="10"><span class="v" id="trimBV"></span></div>
     <div class="row" style="flex-wrap:wrap;gap:6px"><button class="btn sm" id="btnTrimA" data-i="trimSetA"></button><button class="btn sm" id="btnTrimB" data-i="trimSetB"></button><button class="btn sm" id="btnTrimReset" data-i="trimReset"></button></div>
     <div class="note" id="trimInfo"></div>
    </div>
    <h4 data-i="zoomPan"></h4>
    <div class="row"><label data-i="zoom"></label><input type="range" id="zoom" min="100" max="400" value="100"><span class="v" id="zoomV"></span></div>
    <button class="btn sm" id="btnResetPos" data-i="resetPos"></button>
    <div class="note" data-i="panTip"></div>
    <h4 data-i="animation"></h4><div class="chips" id="animChips"></div>
    <div class="row" id="durRow"><label data-i="duration"></label><input type="range" id="dur" min="3" max="30" value="8"><span class="v" id="durV"></span></div>
    <h4 data-i="filters"></h4><div class="chips" id="filterChips"></div>
    <div class="row"><label data-i="bright"></label><input type="range" id="adjB" min="40" max="180" value="100"><span class="v" id="adjBV"></span></div>
    <div class="row"><label data-i="contrast"></label><input type="range" id="adjC" min="40" max="180" value="100"><span class="v" id="adjCV"></span></div>
    <div class="row"><label data-i="sat"></label><input type="range" id="adjS" min="0" max="200" value="100"><span class="v" id="adjSV"></span></div>
    <button class="btn sm" id="btnResetAdj" data-i="resetAdj"></button>

/* ------------------------------ EXTERNAL CONTENT (templates.json, assets, audio) ------------------------------
   External templates are DECLARATIVE JSON (no code is ever executed): background + layers + frames + texts.
   Everything from the network is validated/clamped below before it reaches the canvas.                       */
const NET = {
  isHttp:u=>/^https?:\/\//i.test(u),
  proxyOn(){const p=CONFIG.CORS_PROXY_FALLBACK;return !!(p&&p.enabled&&p.prefix);},
  proxied(u){const p=CONFIG.CORS_PROXY_FALLBACK;return p.prefix+(p.encode===false?u:encodeURIComponent(u));},
  async raw(url){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),CONFIG.FETCH_TIMEOUT_MS||8000);
    try{const r=await fetch(url,{mode:'cors',signal:ctl.signal,cache:'no-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return r;}
    catch(e){throw new Error(e&&e.name==='AbortError'?'Timeout':((e&&e.message)||'Network error'));}finally{clearTimeout(to);}},
  async json(url){try{return await (await this.raw(url)).json();}
    catch(e){if(this.proxyOn()&&this.isHttp(url))return await (await this.raw(this.proxied(url))).json();throw e;}},
  // github.com/.../blob/... pages -> raw.githubusercontent.com (which sends CORS headers)
  normalize(u){u=(u||'').trim();const m=u.match(/^https?:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/i);return m?`https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`:u;}
};

/* Image assets: always crossOrigin="anonymous" so the canvas is never tainted (export keeps working).
   If the direct load fails and CORS_PROXY_FALLBACK is enabled, one retry goes through the proxy.        */
const ASSETS = {
  map:new Map(),onChange:null,
  changed(){if(typeof this.onChange==='function')this.onChange();},
  get(url){const e=this.map.get(url)||this.load(url);return e.state==='ready'?e.img:null;},
  load(url){let e=this.map.get(url);if(e)return e;
    e={url,state:'loading',img:null};
    e.promise=new Promise(res=>{
      const attempt=(src,last)=>{const im=new Image();im.crossOrigin='anonymous';
        im.onload=()=>{e.img=im;e.state='ready';ASSETS.changed();res(e);};
        im.onerror=()=>{if(!last&&NET.proxyOn()&&NET.isHttp(url))attempt(NET.proxied(url),true);else{e.state='failed';ASSETS.changed();res(e);}};
        im.src=src;};
      attempt(url,false);});
    this.map.set(url,e);return e;},
  retryFailed(){[...this.map].forEach(([k,e])=>{if(e.state==='failed')this.map.delete(k);});}
};
async function preloadAssets(tpl,ms=6000){const urls=(tpl&&tpl.assets)||[];if(!urls.length)return;
  await Promise.race([Promise.all(urls.map(u=>ASSETS.load(u).promise)),new Promise(r=>setTimeout(r,ms))]);}

const EXT={sources:[],
  cache(){return LS.get('pts.extCache',{});},
  setCache(url,json){const c=this.cache();c[url]=json;LS.set('pts.extCache',c);},
  dropCache(url){const c=this.cache();delete c[url];LS.set('pts.extCache',c);},
  persist(){LS.set('pts.extSrc',this.sources.filter(s=>s.origin==='user'||s.origin==='file').map(s=>({url:s.url,origin:s.origin})));},
  find(url){return this.sources.find(s=>s.url===url);}};

function extLabel(s){const n=(s.count||0)+' '+L('tplWord')+(s.audio?' · '+s.audio+' '+L('trkWord'):'');
  return s.state==='ready'?L('stReady')+' · '+n:s.state==='cached'?L('extCached')+' · '+n:s.state==='failed'?L('stFailed'):L('stLoading');}
function renderExt(){const box=$('#extList');if(!box)return;box.innerHTML='';
  if(!EXT.sources.length){const n=document.createElement('div');n.className='note';n.textContent=L('extNone');box.appendChild(n);return;}
  EXT.sources.forEach(s=>{const d=document.createElement('div');d.className='extrow';
    const nm=document.createElement('div');nm.className='nm';nm.textContent=(s.origin==='config'?'⚙ ':'')+s.url.replace(/^https?:\/\//,'');nm.title=s.url+(s.msg?'\n'+s.msg:'');
    const chip=document.createElement('span');chip.className='tag st '+({loading:'loading',idle:'loading',ready:'ready',cached:'ready',failed:'failed'}[s.state]||'');chip.textContent=extLabel(s);if(s.msg&&s.state!=='ready')chip.title=s.msg;
    d.append(nm,chip);
    if(s.origin!=='config'){const x=document.createElement('button');x.className='x';x.textContent='×';x.onclick=()=>removeExternal(s.url);d.appendChild(x);}
    box.appendChild(d);});}

async function refreshSource(s){s.state='loading';s.msg='';renderExt();let json=null,cached=false;
  try{if(s.origin==='file'){json=EXT.cache()[s.url];if(!json)throw new Error('No saved data');cached=true;}
      else{json=await NET.json(s.url);EXT.setCache(s.url,json);}}
  catch(e){const c=EXT.cache()[s.url];if(c){json=c;cached=true;s.msg=String(e.message||e);}else{s.state='failed';s.msg=String(e.message||e);renderExt();return false;}}
  try{const r=applyExternal(json,s.url);s.count=r.templates;s.audio=r.audio;s.state=(cached&&s.origin!=='file')?'cached':'ready';
    if(!r.templates&&!r.audio&&!(json&&typeof json==='object'&&!Array.isArray(json)&&Array.isArray(json.audio))){s.state='failed';s.msg=L('extEmpty');}}
  catch(e){s.state='failed';s.msg=String(e.message||e);}
  renderExt();return s.state!=='failed';}

function initExternal(){
  [].concat(CONFIG.TEMPLATES_JSON_URL||[]).filter(u=>typeof u==='string'&&u.trim()).forEach(u=>{u=NET.normalize(u);if(!EXT.find(u))EXT.sources.push({url:u,origin:'config',state:'idle'});});
  LS.get('pts.extSrc',[]).forEach(x=>{if(x&&typeof x.url==='string'&&!EXT.find(x.url))EXT.sources.push({url:x.url,origin:x.origin==='file'?'file':'user',state:'idle'});});
  try{const q=new URLSearchParams(location.search).get('templates');if(q){const u=NET.normalize(q);if(!EXT.find(u))EXT.sources.push({url:u,origin:'param',state:'idle'});}}catch(e){}
  registerAudio(CONFIG.EXTERNAL_AUDIO_TRACKS,'config');
  const cache=EXT.cache();   // instant start from the last good copy (works offline); fresh copies are fetched in the background
  EXT.sources.forEach(s=>{if(cache[s.url]){try{const r=applyExternal(cache[s.url],s.url);s.count=r.templates;s.audio=r.audio;s.state=s.origin==='file'?'ready':'cached';}catch(e){}}});}
function refreshAllExternal(){ASSETS.retryFailed();return Promise.all(EXT.sources.map(s=>refreshSource(s).then(afterExternal)));}

async function addExternalUrl(raw){const url=NET.normalize(raw);if(!url)return;
  if(/^[a-z][a-z0-9+.-]*:/i.test(url)&&!NET.isHttp(url)){toast(L('extBadUrl'));return;}
  let s=EXT.find(url);if(!s){s={url,origin:'user',state:'idle'};EXT.sources.push(s);EXT.persist();}
  const ok=await refreshSource(s);afterExternal();toast(ok?L('extDone'):L('extFail'));if(ok)$('#extUrl').value='';}
function removeExternal(url){const s=EXT.find(url);if(!s||s.origin==='config')return;removeSource(url);EXT.sources.splice(EXT.sources.indexOf(s),1);EXT.dropCache(url);EXT.persist();afterExternal();}

  if(meaningful(restored))setTimeout(()=>toast(L('draftRestored')+(restored.hadVideo?' · '+L('draftVideo'):'')+(restored.hadAudio?' · '+L('draftAudio'):'')),500);
  try{document.fonts.ready.then(()=>{THUMBS.clear();buildTemplates();dirty=true;});}catch(e){}
  preloadAudioStatuses();
  EXT.sources.forEach(s=>refreshSource(s).then(afterExternal));   // background refresh; a failure just keeps built-ins / the cached copy
})();
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if((e.code==='Delete'||e.code==='Backspace')&&st.selS){e.preventDefault();removeSticker(st.selS);return;}if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){e.preventDefault();e.shiftKey?redo():undo();return;}if((e.ctrlKey||e.metaKey)&&e.code==='KeyY'){e.preventDefault();redo();return;}if(e.code==='Space'){e.preventDefault();TR.playing?pause():play();}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{});} // network-first cache: repeat visits are instant, new deploys still win
